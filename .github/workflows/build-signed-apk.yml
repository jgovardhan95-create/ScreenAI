name: Build Signed Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Signed APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env from GitHub Secrets (Secrets Gradle Plugin)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          else
            cp .env.example .env
          fi

      - name: Prepare Debug & Release Keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            FALLBACK_STORE_PASS="${STORE_PASSWORD:-androidrelease}"
            FALLBACK_KEY_PASS="${KEY_PASSWORD:-androidrelease}"
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "$FALLBACK_STORE_PASS" \
              -alias upload \
              -keypass "$FALLBACK_KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ScreenAI Assistant,OU=Mobile,O=ScreenAI,L=Mountain View,S=CA,C=US"
          fi

      - name: Build Signed Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'androidrelease' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'androidrelease' }}
        run: |
          gradle :app:assembleDebug :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ScreenAI-Assistant-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk ScreenAI-Assistant-debug.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenAI-Assistant-Release-APK
          path: ScreenAI-Assistant-release.apk
          if-no-files-found: error

      - name: Upload Signed Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenAI-Assistant-Debug-APK
          path: ScreenAI-Assistant-debug.apk
          if-no-files-found: warn

      - name: Publish Direct APK Download to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "ScreenAI Assistant APK (Build #${{ github.run_number }})"
          body: "Direct `.apk` downloads for ScreenAI Assistant. Click `ScreenAI-Assistant-release.apk` or `ScreenAI-Assistant-debug.apk` below under **Assets** to download and install on your Android phone."
          files: |
            ScreenAI-Assistant-release.apk
            ScreenAI-Assistant-debug.apk
          make_latest: true
