name: Build Signed Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble Signed APK & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Create .env from GitHub Secrets (Secrets Gradle Plugin)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          else
            cp .env.example .env
          fi

      - name: Prepare Debug & Release Keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Ensure debug.keystore exists for debugConfig signing
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Decode release keystore from secret, or generate a fallback upload key if not configured
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            FALLBACK_STORE_PASS="${STORE_PASSWORD:-androidrelease}"
            FALLBACK_KEY_PASS="${KEY_PASSWORD:-androidrelease}"
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "$FALLBACK_STORE_PASS" \
              -alias upload \
              -keypass "$FALLBACK_KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ScreenAI Assistant,OU=Mobile,O=ScreenAI,L=Mountain View,S=CA,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Signed Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'androidrelease' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'androidrelease' }}
        run: gradle :app:assembleDebug :app:assembleRelease

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenAI-Assistant-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Signed Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenAI-Assistant-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
